name: CI projektu

on:
  push:
    branches: [ main ]
    paths: [ 'projekt/**' ]
  pull_request:
    paths: [ 'projekt/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          
      - run: mvn -B verify
        working-directory: projekt
